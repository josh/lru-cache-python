name: Test

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: |
          uv run python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest

  ruff:
    runs-on: ubuntu-24.04

    env:
      RUFF_OUTPUT_FORMAT: github

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Ruff Formatter
        run: |
          uv run ruff format --diff .

      - name: Ruff Linter
        run: |
          uv run ruff check .

  mypy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: mypy
        run: |
          uv run mypy .
