name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Build package
        run: |
          uv run python -m build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lru_cache.py
            dist/*
