[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "lru-cache"
version = "1.0.1"
description = "Persisted LRU cache Python module"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Joshua Peek" } ]
authors = [ { name = "Joshua Peek" } ]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [  ]

optional-dependencies.dev = [
    "mypy>=1,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<0.7",
]

[tool.setuptools]
py-modules = [ "lru_cache" ]

[tool.hatch.build.targets.wheel.force-include]
"lru_cache.py" = "lru_cache/__init__.py"
"py.typed" = "lru_cache/py.typed"

[tool.hatch.build.targets.sdist]
include = [ "lru_cache.py", "py.typed" ]

[tool.ruff]
lint.extend-select = [ "G", "I", "LOG", "PT", "SIM", "TCH", "UP" ]

[tool.pyproject-fmt]
indent = 4

[tool.mypy]
strict = true
